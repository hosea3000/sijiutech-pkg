version: "2"
sql:
  - engine: "mysql"
    queries: "sql/"
    schema: "schema/"
    gen:
      go:
        package: "repository"
        out: "repository"
        overrides:
          - db_type: "json"
            go_type:
              type: "[]byte"  # workaround sqlc bug when reading null json columns
            nullable: true
          - db_type: "tinyint"
            go_type:
              type: "int8"   # 因为数据库中的tinyint(1) 不能生成bool 类型，有的status数据为2
